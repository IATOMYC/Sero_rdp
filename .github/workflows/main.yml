
name: Kali Linux + XFCE + RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  kali-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Restrict RDP to Tailscale
        run: |
          sudo iptables -I INPUT 1 \
            -p tcp --dport 3389 ! -i tailscale0 -j DROP

          sudo iptables -I INPUT 1 \
            -i tailscale0 -p tcp --dport 3389 -j ACCEPT

      - name: Start Kali Linux Desktop
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          DOWNLOAD_SCRIPT_URL: ${{ secrets.DOWNLOAD_SCRIPT_URL }}
        run: |
          set -e

          if [ -z "$RDP_PASSWORD" ]; then
            echo "RDP_PASSWORD secret is required"
            exit 1
          fi

          docker pull kalilinux/kali-rolling:latest

          docker run -d \
            --name kali-rdp \
            --network host \
            -e RDP_PASSWORD="$RDP_PASSWORD" \
            kalilinux/kali-rolling:latest \
            bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y --no-install-recommends \
                xfce4 \
                xrdp \
                xorgxrdp \
                dbus-x11 \
                ca-certificates \
                curl

              useradd -m -s /bin/bash kaliuser

              printf "kaliuser:%s\n" "$RDP_PASSWORD" | chpasswd

              mkdir -p /home/kaliuser/Downloads

              echo "startxfce4" > /home/kaliuser/.xsession

              chown -R kaliuser:kaliuser /home/kaliuser

              /usr/sbin/xrdp-sesman

              exec /usr/sbin/xrdp --nodaemon
            '

      - name: Download Download.sh
        env:
          DOWNLOAD_SCRIPT_URL: ${{ secrets.DOWNLOAD_SCRIPT_URL }}
        run: |
          if [ -n "$DOWNLOAD_SCRIPT_URL" ]; then
            docker exec \
              -e DOWNLOAD_SCRIPT_URL="$DOWNLOAD_SCRIPT_URL" \
              kali-rdp bash -lc '
                curl -fL --retry 3 \
                  "$DOWNLOAD_SCRIPT_URL" \
                  -o /home/kaliuser/Downloads/Download.sh

                chmod 700 /home/kaliuser/Downloads/Download.sh
                chown kaliuser:kaliuser \
                  /home/kaliuser/Downloads/Download.sh
              '
          fi

      - name: Verify RDP
        run: |
          TS_IP=$(tailscale ip -4 | head -n1)

          echo "Kali Linux is starting..."
          echo "Tailscale IP: $TS_IP"

          for i in {1..30}; do
            if timeout 2 bash -c \
              '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
              echo "RDP is ready!"
              break
            fi

            sleep 2
          done

          echo "RDP_ADDRESS=$TS_IP" >> "$GITHUB_ENV"

      - name: Maintain Session
        run: |
          echo "Kali Linux XFCE is running"
          echo "RDP: $RDP_ADDRESS:3389"
          echo "Username: kaliuser"

          sleep 21000
