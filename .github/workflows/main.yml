
name: Kali Linux + XFCE + Tailscale + RDP

on:
  workflow_dispatch:

jobs:
  kali-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "Missing Tailscale Auth Key"
            exit 1
          fi

          sudo tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="kali-${GITHUB_RUN_ID}"

          TS_IP=$(tailscale ip -4 | head -n1)

          if [ -z "$TS_IP" ]; then
            echo "Tailscale connection failed"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Configure Firewall
        run: |
          sudo iptables -I INPUT 1 \
            -i tailscale0 \
            -p tcp --dport 3389 \
            -j ACCEPT

          sudo iptables -I INPUT 2 \
            -p tcp --dport 3389 \
            -j DROP

      - name: Download Kali Linux
        run: |
          docker pull kalilinux/kali-rolling:latest

      - name: Setup Kali XFCE and RDP
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -e

          if [ -z "$RDP_PASSWORD" ]; then
            echo "Missing RDP_PASSWORD"
            exit 1
          fi

          docker run -d \
            --name kali-rdp \
            --network host \
            -e RDP_PASSWORD="$RDP_PASSWORD" \
            kalilinux/kali-rolling:latest \
            bash -lc '
              set -e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y --no-install-recommends \
                xfce4 \
                xfce4-goodies \
                xrdp \
                xorgxrdp \
                dbus-x11 \
                ca-certificates \
                curl

              useradd -m -s /bin/bash kaliuser

              echo "kaliuser:${RDP_PASSWORD}" | chpasswd

              mkdir -p /home/kaliuser/Downloads

              echo "exec startxfce4" > /home/kaliuser/.xsession

              chown -R kaliuser:kaliuser /home/kaliuser

              adduser xrdp ssl-cert || true

              /usr/sbin/xrdp-sesman

              exec /usr/sbin/xrdp --nodaemon
            '

      - name: Download Download.sh
        env:
          DOWNLOAD_SCRIPT_URL: ${{ secrets.DOWNLOAD_SCRIPT_URL }}
        run: |
          if [ -n "$DOWNLOAD_SCRIPT_URL" ]; then
            docker exec \
              -e DOWNLOAD_SCRIPT_URL="$DOWNLOAD_SCRIPT_URL" \
              kali-rdp bash -lc '
                curl -fL --retry 3 \
                  "$DOWNLOAD_SCRIPT_URL" \
                  -o /home/kaliuser/Downloads/Download.sh

                chmod 700 /home/kaliuser/Downloads/Download.sh

                chown kaliuser:kaliuser \
                  /home/kaliuser/Downloads/Download.sh
              '
          else
            echo "Download URL not configured"
          fi

      - name: Verify RDP
        run: |
          set -e

          READY=0

          for i in {1..60}; do
            if timeout 2 bash -c \
              '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            docker logs kali-rdp
            exit 1
          fi

          echo "================================"
          echo "KALI LINUX XFCE READY"
          echo "================================"
          echo "IP: $TAILSCALE_IP"
          echo "PORT: 3389"
          echo "USERNAME: kaliuser"
          echo "================================"

      - name: Keep Desktop Running
        run: |
          while true; do
            echo "[$(date)] Kali Linux RDP Active"
            sleep 300
          done
